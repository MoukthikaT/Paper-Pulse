version: '3.8'

services:
  # MongoDB Replica Set (Single-node replica set for native ACID multi-document transactions)
  mongo:
    image: mongo:7.0
    container_name: paperpulse-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Python FastAPI Machine Learning Microservice
  ml-service:
    build:
      context: ./backend/ml
      dockerfile: Dockerfile
    container_name: paperpulse-ml
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Node.js Express Trading Engine & API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paperpulse-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/paper_pulse?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:-paperpulse_production_secure_jwt_secret_key_2026_demo}
      - JWT_EXPIRES_IN=7d
      - INITIAL_WALLET_BALANCE=100000
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
      - FRONTEND_URL=http://localhost:3000
      - ML_SERVICE_URL=http://ml-service:8000
      - SEED_DEMO_USER=false
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # React Vite SPA Frontend served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: paperpulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
    driver: local
